<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling the coding club</title>
    <link rel="stylesheet" href="./week5.css">
</head>
<body>
   <div>
    <div id="one" class="box">
        <h1>Coding Club</h1>
        <p>Learn.Build.Share</p>
    </div>
    <div class="main">
        <h2>Upcoming Events</h2>
        <table>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>

            <tr>
                <td>HTML Workshop</td>
                <td>12 Nov</td>
                <td>Seminar Hall 1</td>
            </tr>

            <tr>
                <td>Hackathon</td>
                <td>15 Nov</td>
                <td>Seminar Hall 2</td>
            </tr>
        </table>
    </div>
    <div class="main">
        <h2>Register</h2>

        <form>
            <label>Name:</label>
            <input type="text" placeholder="Your name">
            <br><br>

            <label>Email:</label>
            <input type="email" placeholder="you@example.com">
            <br><br>

            <button type="submit">Register</button>
        </form>
    </div>
   </div>
    
</body>
</html>
