<!DOCTYPE html>
<html>
    <head>
     <title>SIGN UP</title>
    </head>
    <body>
        <h1>Create Your Account</h1>
        <form method="POST">
            <label for="full-name">Full Name</label>
        <input
                type="text"
                id="full-name"
                name="full-name"
                placeholder="Enter your full name"
                required>
                <br><br>
                <span>Gender</span>
                <label> 
                    <input type="radio" name="gender" value="Male" required> Male </input>
                </label>
                <label>
                    <input type="radio" name="gender" value="Female" required> Female </input>
                </label>
                <input type="radio" name="gender" value="Other" required> Other </input>
                </label>
                <br><br>
                <span>Programming Language</span>
                <label>
                    <input type="checkbox" name="Programming Language" value="HTML" required> HTML </input>
                </label>
                <input type="checkbox" name="Programming Language" value="C" required> C </input>
                </label>
                <input type="checkbox" name="Programming Language" value="JAVA" required> JAVA </input>
                </label>
                <input type="checkbox" name="Programming Language" value="PYTHON" required> PYTHON </input>
                </label>
                <input type="checkbox" name="Programming Language" value="C++" required> C++ </input>
                </label>
                <br><br>
                <label for="country">Country</label>
                <select id="country" name="country"> 
                <option value=""disabled selected>Select a Country</option>
                <option value="usa">USA</option>
                <option value="india">India</option>
                <option value="canada">Canada</option>
                <option value="china">China</option>
                </select>
                <br><br>
                <label for="email">Email</label>
                <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>
                <br><br>
                <label for="Phone">Phone Number</label>
                <input type="tel" id="phone" name="phone number">
                <br><br>
                <label for="password">Password</label>
                <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>
                <br><br>
                <label for="github">Github Profile</label>
                <input type="url" id="github" name="Github Profile" placeholder="Enter your github profile">
                <br><br>
                <label for="date">Date Of Birth</label>
                <input type="date" id="DOB">
                <br><br>
                <label for="age">Age</label>
                <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter your age"
                required>
                <br><br>
                <button type="submit">Create Account</button>
                <button type="reset">Reset</button>
        </form>
    </body>
</html>
